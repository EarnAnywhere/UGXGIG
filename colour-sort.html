<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Colour Sort Showdown — UGXGIG</title>
<style>
:root{--bg:#10303a;--card:#1b4756;--ink:#fff;--mut:#a9d3df;--acc:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:16px}
h1{text-align:center;margin:8px 0 4px;font-size:30px}
.sub{text-align:center;color:var(--mut);margin-bottom:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:2px solid #2d6a7f;background:#10303a;color:#fff;font-size:20px;margin-bottom:10px}
button{font-size:18px;font-weight:700;border:0;border-radius:14px;padding:14px 18px;background:var(--acc);color:#10303a;width:100%;margin-top:8px}
button.sec{background:#2d6a7f;color:#fff}
.code{font-size:36px;font-weight:800;letter-spacing:.3em;text-align:center;margin:14px 0}
.err{color:#ff8a8a;text-align:center;min-height:1.2em}
.btns{display:flex;gap:8px}
.big{font-size:24px;text-align:center;font-weight:800;margin:10px 0}
.stats{display:flex;justify-content:space-between;font-size:17px;margin-bottom:10px}
.tubes{display:flex;flex-wrap:wrap;gap:14px 12px;justify-content:center;padding:8px 0}
.tube{width:46px;height:176px;border:3px solid #cfeaf1;border-radius:6px 6px 24px 24px;display:flex;flex-direction:column-reverse;padding:3px;gap:3px;background:rgba(255,255,255,.07)}
.tube.sel{transform:translateY(-12px);border-color:var(--acc)}
.seg{flex:1;border-radius:6px}
.row{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #2d6a7f;font-size:19px}
.pl{display:flex;gap:6px;margin-bottom:12px}
.pl div{flex:1;background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;border:2px solid transparent}
.pl div.on{border-color:var(--acc)}
.pl b{display:block;font-size:20px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBEePsSdUMz0X5oGNM81TE3xKbwAas9L_Q",
  authDomain: "ugxgig-games.firebaseapp.com",
  databaseURL: "https://ugxgig-games-default-rtdb.firebaseio.com/",
  projectId: "ugxgig-games",
  storageBucket: "ugxgig-games.firebasestorage.app",
  messagingSenderId: "341111144918",
  appId: "1:341111144918:web:3b49eca252e90449132477",
  measurementId: "G-PS5JKTS763"
});
const db = firebase.database();

const PAL=["#ff5c6c","#4dabf7","#2ecc71","#ffd23f","#b06cff","#ff9f43","#1dd1c1","#f368e0"];
const LEVELS=[4,5,6];
const CAP=4;
const SLOTS=["p1","p2","p3","p4"];
const app=document.getElementById("app");
let S={};
let roomCode=null,myRole=null,myName="",roomRef=null;
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeLevel(n,seed){
  const r=rng(seed);let pool=[];
  for(let c=0;c<n;c++)for(let k=0;k<CAP;k++)pool.push(c);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const tubes=[];
  for(let i=0;i<n;i++)tubes.push(pool.slice(i*CAP,i*CAP+CAP));
  tubes.push([],[]);
  return tubes;
}
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s}

function setup(){
  const urlName=new URLSearchParams(location.search).get('name')||"";
  app.innerHTML=`<h1>🎨 Colour Sort Showdown</h1><div class="sub">Up to 4 players · same puzzle, fewest total moves wins</div>
  <div class="card">
    <input type="text" id="pname" placeholder="Your name" value="${esc(urlName)}">
    <button onclick="createRoom()">Create new match</button>
    <div class="sub" style="margin:8px 0">— or —</div>
    <input type="text" id="jcode" placeholder="Match code" maxlength="5" style="text-transform:uppercase">
    <button class="sec" onclick="joinRoom()">Join match</button>
    <div class="err" id="err"></div>
  </div>`;
}

function createRoom(){
  myName=document.getElementById("pname").value.trim();
  if(!myName)return showErr("Enter your name first");
  roomCode=genCode();myRole="p1";
  roomRef=db.ref("rooms_coloursort/"+roomCode);
  roomRef.set({status:"lobby",seed:Math.floor(Math.random()*1e6),createdAt:Date.now(),
    players:{p1:{name:myName,totalMoves:0,totalTime:0,level:0,done:false}}}).then(()=>{
    showShare();
    roomRef.child("players").on("value",snap=>{if(countJoined(snap.val())>=2)roomRef.child("status").once("value").then(s=>{if(s.val()==="lobby")document.getElementById("startBtn")&&(document.getElementById("startBtn").disabled=false)})});
    roomRef.child("status").on("value",snap=>{if(snap.val()==="playing")enterGame()});
  });
}
function countJoined(players){return players?Object.keys(players).length:0}

function showShare(){
  app.innerHTML=`<h1>Match code</h1><div class="card"><div class="code">${roomCode}</div>
  <div class="sub">Share this with up to 3 friends. Start once at least 2 of you have joined.</div>
  <button id="startBtn" onclick="hostStart()" disabled>Start game</button></div>`;
  roomRef.child("players").on("value",snap=>{
    const n=countJoined(snap.val());
    const btn=document.getElementById("startBtn");
    if(btn)btn.disabled=n<2;
  });
}
function hostStart(){roomRef.update({status:"playing"})}

function joinRoom(){
  myName=document.getElementById("pname").value.trim();
  const code=(document.getElementById("jcode").value||"").trim().toUpperCase();
  if(!myName)return showErr("Enter your name first");
  if(code.length<4)return showErr("Enter the match code");
  roomRef=db.ref("rooms_coloursort/"+code);
  roomRef.once("value").then(snap=>{
    if(!snap.exists())return showErr("No match found with that code");
    const players=snap.val().players||{};
    const free=SLOTS.find(s=>!players[s]);
    if(!free)return showErr("That match is full");
    roomCode=code;myRole=free;
    roomRef.child("players/"+free).set({name:myName,totalMoves:0,totalTime:0,level:0,done:false}).then(()=>{
      app.innerHTML=`<h1>Joined!</h1><div class="card sub">Waiting for the host to start the game&hellip;</div>`;
      roomRef.child("status").on("value",snap2=>{if(snap2.val()==="playing")enterGame()});
    });
  });
}
function showErr(m){document.getElementById("err").textContent=m}

function enterGame(){
  roomRef.child("status").off();
  roomRef.once("value").then(snap=>{
    S={seed:snap.val().seed,level:0,totalMoves:0,totalTime:0};
    play();
  });
}

function play(){
  S.tubes=makeLevel(LEVELS[S.level],S.seed+S.level);
  S.hist=[];S.moves=0;S.sel=null;S.t0=Date.now();
  draw();
}
function draw(){
  app.innerHTML=`<div class="stats"><span>Moves: <b>${S.moves}</b></span><span>Level ${S.level+1} of ${LEVELS.length}</span></div>
  <div class="tubes">${S.tubes.map((t,i)=>`<div class="tube ${S.sel===i?"sel":""}" onclick="tap(${i})">${t.map(c=>`<div class="seg" style="background:${PAL[c]}"></div>`).join("")}</div>`).join("")}</div>
  <div class="btns"><button class="sec" onclick="undo()">↩ Undo</button><button class="sec" onclick="giveUp()">Give up</button></div>`;
}
function tap(i){
  if(S.sel===null){if(S.tubes[i].length)S.sel=i;draw();return}
  if(S.sel===i){S.sel=null;draw();return}
  const from=S.tubes[S.sel],to=S.tubes[i];
  const col=from[from.length-1];
  if(to.length>=CAP||(to.length&&to[to.length-1]!==col)){S.sel=to.length?i:null;draw();return}
  S.hist.push(JSON.stringify(S.tubes));
  while(from.length&&from[from.length-1]===col&&to.length<CAP)to.push(from.pop());
  S.moves++;S.sel=null;draw();
  if(S.tubes.every(t=>t.length===0||(t.length===CAP&&t.every(c=>c===t[0]))))setTimeout(()=>finishLevel(S.moves),400);
}
function undo(){if(!S.hist.length)return;S.tubes=JSON.parse(S.hist.pop());S.moves=Math.max(0,S.moves-1);S.sel=null;draw()}
function giveUp(){if(confirm("Give up this level?"))finishLevel(999)}

function finishLevel(moves){
  S.totalMoves+=moves;
  S.totalTime+=(Date.now()-S.t0)/1000;
  S.level++;
  roomRef.child("players/"+myRole).update({totalMoves:S.totalMoves,totalTime:Math.round(S.totalTime),level:S.level});
  if(S.level<LEVELS.length){
    app.innerHTML=`<div class="card"><div class="big">${moves===999?"Gave up":"Solved in "+moves+" moves!"}</div>
    <div class="sub">Total moves so far: ${S.totalMoves}</div>
    <button onclick="play()">Next level</button></div>`;
  }else{
    roomRef.child("players/"+myRole).update({done:true});
    showLeaderboard();
  }
}

function showLeaderboard(){
  app.innerHTML=`<h1>🏆 Results</h1><div class="card" id="lb">Waiting for everyone to finish&hellip;</div>`;
  roomRef.child("players").on("value",snap=>{
    const players=snap.val()||{};
    const list=Object.values(players);
    const allDone=list.every(p=>p.done);
    const sorted=list.slice().sort((a,b)=>a.totalMoves-b.totalMoves||a.totalTime-b.totalTime);
    document.getElementById("lb").innerHTML=sorted.map((p,i)=>`
      <div class="row"><span>${["🥇","🥈","🥉","4️⃣"][i]||""} ${esc(p.name)}</span>
      <span>${p.done?p.totalMoves+" moves · "+p.totalTime+"s":"still playing…"}</span></div>
    `).join("");
    if(allDone){
      const winner=sorted[0];
      document.getElementById("lb").innerHTML+=`<div class="big">${esc(winner.name)} wins!</div>`;
    }
  });
}
setup();
</script>
</body>
</html>
